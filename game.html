<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overworld — Dragon Quest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="game.css" />
    <link rel="stylesheet" href="inventory.css" />
  </head>
  <body class="game-page">
    <div class="game-backdrop" aria-hidden="true"></div>

    <main class="game-shell">
      <header class="hud rpg-window">
        <div class="hud__top">
          <a class="back-link" href="party.html">← Party</a>
          <h1 class="hud__title">Dragon Quest</h1>
          <div class="hud__top-right">
            <button type="button" class="inventory-btn" id="inventoryBtn">Inventory</button>
            <p class="hud__coords" id="coordsLabel">—</p>
          </div>
        </div>
        <p class="hud__location" id="locationLabel">Initial Sequence</p>
        <ul class="party-strip" id="partyStrip" aria-label="Your party"></ul>
      </header>

      <section class="stage rpg-window" aria-label="Current scene">
        <div class="scene-frame" id="sceneFrame">
          <div class="scene-art" id="sceneArt"><!-- SVG scene --></div>
          <div class="entity-layer" id="entityLayer" aria-hidden="true"></div>
        </div>
        <p class="scene-caption" id="sceneCaption">Entering the world…</p>
      </section>

      <div class="lower">
        <section class="minimap-wrap rpg-window" aria-label="World map">
          <h2 class="section-label">World</h2>
          <div class="minimap" id="minimap" role="grid" aria-rowcount="24" aria-colcount="8"></div>
        </section>

        <section class="controls rpg-window">
          <p class="status" id="statusLine" aria-live="polite">
            Hold an arrow key to walk the scene. Reach an edge to travel on. Mountains are impassable.
          </p>
          <div class="dpad" role="group" aria-label="Move party">
            <button type="button" class="dpad__btn dpad__up" data-dx="0" data-dy="-1" aria-label="Move north">
              ▲
            </button>
            <button type="button" class="dpad__btn dpad__left" data-dx="-1" data-dy="0" aria-label="Move west">
              ◀
            </button>
            <button type="button" class="dpad__btn dpad__ok" disabled aria-hidden="true">◆</button>
            <button type="button" class="dpad__btn dpad__right" data-dx="1" data-dy="0" aria-label="Move east">
              ▶
            </button>
            <button type="button" class="dpad__btn dpad__down" data-dx="0" data-dy="1" aria-label="Move south">
              ▼
            </button>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="game.js"></script>
  </body>
</html>
