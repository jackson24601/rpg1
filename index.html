<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragon Quest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="title-screen" aria-label="Dragon Quest title screen">
      <div class="scene" aria-hidden="true">
        <svg
          class="scene-art"
          viewBox="0 0 800 600"
          xmlns="http://www.w3.org/2000/svg"
          role="img"
        >
          <defs>
            <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#1a2744" />
              <stop offset="42%" stop-color="#3d4f7a" />
              <stop offset="68%" stop-color="#c46b3a" />
              <stop offset="100%" stop-color="#f0c27a" />
            </linearGradient>
            <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff2b0" />
              <stop offset="100%" stop-color="#ff9a3c" />
            </linearGradient>
            <linearGradient id="farMount" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#6b7fa8" />
              <stop offset="100%" stop-color="#4a5a7a" />
            </linearGradient>
            <linearGradient id="midMount" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#4e6a4a" />
              <stop offset="55%" stop-color="#3a5238" />
              <stop offset="100%" stop-color="#2a3a28" />
            </linearGradient>
            <linearGradient id="nearHill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#3f6b32" />
              <stop offset="100%" stop-color="#243f1d" />
            </linearGradient>
            <linearGradient id="dragonBody" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#2f7a4a" />
              <stop offset="100%" stop-color="#1a4d2e" />
            </linearGradient>
            <linearGradient id="wingGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#c4543a" />
              <stop offset="100%" stop-color="#7a2a1e" />
            </linearGradient>
            <filter id="pixelSoft" x="-2%" y="-2%" width="104%" height="104%">
              <feComponentTransfer>
                <feFuncR type="discrete" tableValues="0 0.12 0.25 0.38 0.5 0.62 0.75 0.88 1" />
                <feFuncG type="discrete" tableValues="0 0.12 0.25 0.38 0.5 0.62 0.75 0.88 1" />
                <feFuncB type="discrete" tableValues="0 0.12 0.25 0.38 0.5 0.62 0.75 0.88 1" />
              </feComponentTransfer>
            </filter>
            <pattern id="dither" width="4" height="4" patternUnits="userSpaceOnUse">
              <rect width="4" height="4" fill="transparent" />
              <rect width="1" height="1" fill="rgba(0,0,0,0.12)" />
              <rect x="2" y="2" width="1" height="1" fill="rgba(0,0,0,0.12)" />
            </pattern>
          </defs>

          <!-- Sky -->
          <rect width="800" height="600" fill="url(#skyGrad)" />
          <g class="stars" fill="#f7ecd0" opacity="0.85">
            <circle cx="60" cy="40" r="1.2" />
            <circle cx="140" cy="70" r="1" />
            <circle cx="220" cy="28" r="1.4" />
            <circle cx="310" cy="55" r="1" />
            <circle cx="480" cy="35" r="1.2" />
            <circle cx="560" cy="62" r="1" />
            <circle cx="650" cy="24" r="1.3" />
            <circle cx="730" cy="48" r="1" />
            <circle cx="90" cy="95" r="0.9" />
            <circle cx="400" cy="20" r="1.1" />
          </g>
          <circle class="sun" cx="620" cy="210" r="46" fill="url(#sunGrad)" />
          <circle cx="620" cy="210" r="62" fill="#ffb35a" opacity="0.18" />

          <!-- Distant mountains -->
          <g class="mountains-far" fill="url(#farMount)">
            <path d="M0 280 L90 170 L160 240 L240 130 L330 220 L410 150 L500 235 L580 145 L670 230 L760 160 L800 210 L800 320 L0 320 Z" />
          </g>
          <g fill="#dfe8f5" opacity="0.55">
            <path d="M230 145 L240 130 L252 148 L240 142 Z" />
            <path d="M400 164 L410 150 L422 168 L410 160 Z" />
            <path d="M570 160 L580 145 L593 165 L580 157 Z" />
            <path d="M750 175 L760 160 L772 180 L760 171 Z" />
          </g>

          <!-- Mid mountains / forest ridges -->
          <g class="mountains-mid" fill="url(#midMount)">
            <path d="M0 340 L70 270 L150 320 L230 250 L320 315 L420 245 L520 320 L610 260 L700 325 L800 270 L800 390 L0 390 Z" />
          </g>
          <g fill="#1e2f1c" opacity="0.45">
            <ellipse cx="120" cy="330" rx="18" ry="28" />
            <ellipse cx="155" cy="335" rx="14" ry="24" />
            <ellipse cx="280" cy="325" rx="20" ry="30" />
            <ellipse cx="450" cy="330" rx="16" ry="26" />
            <ellipse cx="640" cy="328" rx="22" ry="32" />
            <ellipse cx="760" cy="335" rx="15" ry="25" />
          </g>

          <!-- Castle silhouette -->
          <g class="castle" fill="#2a3348" transform="translate(520,248)">
            <rect x="0" y="20" width="70" height="55" />
            <rect x="-12" y="8" width="18" height="67" />
            <rect x="64" y="0" width="16" height="75" />
            <polygon points="-12,8  -3,-6  6,8" />
            <polygon points="64,0  72,-14  80,0" />
            <rect x="20" y="8" width="10" height="20" />
            <rect x="40" y="12" width="10" height="16" />
            <rect x="28" y="42" width="14" height="18" fill="#1a2233" />
          </g>

          <!-- Soaring dragon -->
          <g class="dragon" transform="translate(180,95) scale(1.05)">
            <g class="dragon-soar">
              <path
                class="wing wing-back"
                d="M70 48 C40 20, 10 10, -10 28 C20 30, 40 45, 62 58 Z"
                fill="url(#wingGrad)"
              />
              <path
                d="M55 55 C80 40, 130 35, 175 48 C195 55, 205 70, 190 78 C160 70, 120 68, 90 78 C70 84, 50 75, 55 55 Z"
                fill="url(#dragonBody)"
              />
              <path
                d="M175 48 C190 35, 210 38, 218 50 C210 52, 195 55, 185 58 Z"
                fill="#245c38"
              />
              <circle cx="205" cy="48" r="2.2" fill="#f6e27a" />
              <path
                d="M190 78 C170 95, 150 110, 145 125"
                fill="none"
                stroke="#1a4d2e"
                stroke-width="6"
                stroke-linecap="round"
              />
              <path
                d="M145 125 L138 132 L150 130 L145 138"
                fill="#c4543a"
              />
              <path
                class="wing wing-front"
                d="M85 52 C95 10, 140 -5, 175 22 C140 28, 115 45, 95 62 Z"
                fill="url(#wingGrad)"
              />
              <path
                d="M95 70 L88 90 M110 72 L108 92 M125 70 L130 88"
                stroke="#163d26"
                stroke-width="3"
                stroke-linecap="round"
              />
            </g>
          </g>

          <!-- Foreground hill -->
          <path
            class="hill"
            d="M0 420 C120 380, 260 400, 400 390 C540 380, 680 400, 800 370 L800 600 L0 600 Z"
            fill="url(#nearHill)"
          />
          <rect width="800" height="600" fill="url(#dither)" opacity="0.35" />

          <!-- Path -->
          <path
            d="M300 600 C340 520, 360 470, 400 430 C440 470, 460 520, 500 600"
            fill="#6b5230"
            opacity="0.55"
          />

          <!-- Heroes party -->
          <g class="heroes" transform="translate(0,0)">
            <!-- Knight -->
            <g class="hero hero-knight" transform="translate(250,400)">
              <ellipse cx="28" cy="115" rx="22" ry="7" fill="#1a2a14" opacity="0.45" />
              <rect x="18" y="48" width="20" height="36" rx="3" fill="#6d7888" />
              <rect x="14" y="44" width="28" height="12" rx="2" fill="#8a95a5" />
              <circle cx="28" cy="34" r="12" fill="#e0b089" />
              <path d="M16 28 H40 V36 C40 22, 16 22, 16 36 Z" fill="#c9a227" />
              <rect x="20" y="84" width="8" height="24" fill="#3a4656" />
              <rect x="30" y="84" width="8" height="24" fill="#3a4656" />
              <rect x="16" y="106" width="14" height="6" fill="#2a2118" />
              <rect x="30" y="106" width="14" height="6" fill="#2a2118" />
              <g class="sword" transform="translate(48,40)">
                <rect x="0" y="0" width="4" height="42" fill="#d8dde6" />
                <rect x="-6" y="34" width="16" height="4" fill="#c9a227" />
                <polygon points="2,-8  -2,0  6,0" fill="#eef2f7" />
              </g>
              <path d="M6 55 L18 50 L18 78 L6 72 Z" fill="#b87333" />
              <circle cx="12" cy="64" r="4" fill="#2f7a4a" />
            </g>

            <!-- Mage -->
            <g class="hero hero-mage" transform="translate(330,412)">
              <ellipse cx="24" cy="108" rx="20" ry="6" fill="#1a2a14" opacity="0.45" />
              <path d="M8 40 L40 40 L36 90 L12 90 Z" fill="#2f4f8a" />
              <path d="M6 38 L42 38 L38 48 L10 48 Z" fill="#3d63a8" />
              <circle cx="24" cy="30" r="11" fill="#e0b089" />
              <path d="M10 26 C14 10, 34 10, 38 26 L34 28 C30 18, 18 18, 14 28 Z" fill="#1e2a44" />
              <polygon points="24,8 20,20 28,20" fill="#c9a227" />
              <rect x="16" y="90" width="7" height="18" fill="#2a2118" />
              <rect x="27" y="90" width="7" height="18" fill="#2a2118" />
              <g class="staff" transform="translate(44,18)">
                <rect x="0" y="10" width="4" height="78" fill="#6b4226" />
                <circle cx="2" cy="6" r="8" fill="#5ec8e6" />
                <circle cx="2" cy="6" r="4" fill="#dff7ff" />
              </g>
            </g>

            <!-- Archer -->
            <g class="hero hero-archer" transform="translate(410,405)">
              <ellipse cx="22" cy="112" rx="18" ry="6" fill="#1a2a14" opacity="0.45" />
              <rect x="12" y="46" width="20" height="34" rx="3" fill="#6b4a2a" />
              <circle cx="22" cy="34" r="11" fill="#e0b089" />
              <path d="M10 28 H34 V36 C28 24, 16 24, 10 36 Z" fill="#3f6b32" />
              <rect x="14" y="80" width="7" height="24" fill="#3a2a18" />
              <rect x="24" y="80" width="7" height="24" fill="#3a2a18" />
              <rect x="11" y="102" width="12" height="5" fill="#2a2118" />
              <rect x="23" y="102" width="12" height="5" fill="#2a2118" />
              <path
                d="M4 40 C-8 60, -6 90, 8 104"
                fill="none"
                stroke="#8b5a2b"
                stroke-width="3"
              />
              <line x1="4" y1="40" x2="8" y2="104" stroke="#d8c39a" stroke-width="1.5" />
              <rect x="34" y="55" width="16" height="3" fill="#c9a227" />
            </g>

            <!-- Cleric -->
            <g class="hero hero-cleric" transform="translate(485,415)">
              <ellipse cx="22" cy="105" rx="18" ry="6" fill="#1a2a14" opacity="0.45" />
              <path d="M8 42 L36 42 L34 88 L10 88 Z" fill="#d9d2c5" />
              <path d="M6 40 L38 40 L34 52 L10 52 Z" fill="#f0ebe1" />
              <circle cx="22" cy="30" r="10" fill="#e0b089" />
              <path d="M12 22 H32 V30 H12 Z" fill="#c9a227" />
              <rect x="20" y="16" width="4" height="14" fill="#c9a227" />
              <rect x="15" y="88" width="6" height="16" fill="#2a2118" />
              <rect x="25" y="88" width="6" height="16" fill="#2a2118" />
              <g transform="translate(40,48)">
                <rect x="0" y="0" width="3" height="40" fill="#c9a227" />
                <rect x="-6" y="8" width="15" height="3" fill="#c9a227" />
              </g>
            </g>
          </g>
        </svg>
      </div>

      <div class="scanlines" aria-hidden="true"></div>

      <header class="brand">
        <h1 class="logo" aria-label="Dragon Quest">
          <span class="logo-line">Dragon</span>
          <span class="logo-line">Quest</span>
        </h1>
        <p class="tagline">An SVGA-era adventure awaits</p>
      </header>

      <div class="cta-wrap">
        <button type="button" class="begin-btn" id="beginQuest">
          <span class="begin-btn__label">Begin Quest</span>
        </button>
      </div>

      <p class="hint" id="statusHint">Press Begin Quest to start your adventure</p>
    </main>

    <script src="main.js"></script>
  </body>
</html>
