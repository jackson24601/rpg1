<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragon Quest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="title-screen" aria-label="Dragon Quest title screen">
      <div class="scene" aria-hidden="true">
        <svg
          class="scene-art"
          viewBox="0 0 1280 720"
          preserveAspectRatio="xMidYMid slice"
          xmlns="http://www.w3.org/2000/svg"
          role="img"
        >
          <defs>
            <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#24365f" />
              <stop offset="28%" stop-color="#5a6ea0" />
              <stop offset="48%" stop-color="#c46b4a" />
              <stop offset="62%" stop-color="#e89a4a" />
              <stop offset="78%" stop-color="#f6d48a" />
              <stop offset="100%" stop-color="#f0c27a" />
            </linearGradient>
            <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff2b0" />
              <stop offset="100%" stop-color="#ff9a3c" />
            </linearGradient>
            <linearGradient id="farMount" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#7d8fb8" />
              <stop offset="100%" stop-color="#556686" />
            </linearGradient>
            <linearGradient id="midMount" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#4e6a4a" />
              <stop offset="55%" stop-color="#3a5238" />
              <stop offset="100%" stop-color="#2a3a28" />
            </linearGradient>
            <linearGradient id="nearHill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#4a7d38" />
              <stop offset="100%" stop-color="#2a4a20" />
            </linearGradient>
            <linearGradient id="dragonBody" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#2f7a4a" />
              <stop offset="100%" stop-color="#1a4d2e" />
            </linearGradient>
            <linearGradient id="wingGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#d45a3e" />
              <stop offset="100%" stop-color="#7a2a1e" />
            </linearGradient>
            <pattern id="dither" width="4" height="4" patternUnits="userSpaceOnUse">
              <rect width="4" height="4" fill="transparent" />
              <rect width="1" height="1" fill="rgba(0,0,0,0.14)" />
              <rect x="2" y="2" width="1" height="1" fill="rgba(0,0,0,0.14)" />
            </pattern>
          </defs>

          <!-- Sky -->
          <rect width="1280" height="720" fill="url(#skyGrad)" />
          <g class="stars" fill="#f7ecd0" opacity="0.9">
            <circle cx="80" cy="48" r="1.5" />
            <circle cx="180" cy="82" r="1.2" />
            <circle cx="300" cy="36" r="1.6" />
            <circle cx="420" cy="70" r="1.2" />
            <circle cx="560" cy="42" r="1.4" />
            <circle cx="720" cy="78" r="1.2" />
            <circle cx="860" cy="30" r="1.5" />
            <circle cx="980" cy="60" r="1.2" />
            <circle cx="1100" cy="44" r="1.4" />
            <circle cx="1200" cy="88" r="1.1" />
            <circle cx="140" cy="110" r="1" />
            <circle cx="640" cy="24" r="1.3" />
          </g>
          <circle class="sun" cx="980" cy="220" r="58" fill="url(#sunGrad)" />
          <circle cx="980" cy="220" r="88" fill="#ffb35a" opacity="0.22" />

          <!-- Distant mountains -->
          <g class="mountains-far" fill="url(#farMount)">
            <path
              d="M0 320 L120 190 L220 270 L340 140 L460 250 L580 160 L720 265 L860 150 L1000 255 L1140 170 L1280 240 L1280 380 L0 380 Z"
            />
          </g>
          <g fill="#eef4fb" opacity="0.7">
            <path d="M328 158 L340 140 L356 162 L340 154 Z" />
            <path d="M568 176 L580 160 L596 180 L580 172 Z" />
            <path d="M848 168 L860 150 L878 172 L860 164 Z" />
            <path d="M1126 186 L1140 170 L1158 190 L1140 182 Z" />
          </g>

          <!-- Mid mountains / forest ridges -->
          <g class="mountains-mid" fill="url(#midMount)">
            <path
              d="M0 400 L110 320 L230 375 L360 290 L500 370 L660 285 L820 375 L960 305 L1120 380 L1280 315 L1280 470 L0 470 Z"
            />
          </g>
          <g fill="#1e2f1c" opacity="0.5">
            <ellipse cx="160" cy="395" rx="22" ry="34" />
            <ellipse cx="210" cy="402" rx="16" ry="28" />
            <ellipse cx="400" cy="388" rx="24" ry="36" />
            <ellipse cx="620" cy="396" rx="18" ry="30" />
            <ellipse cx="900" cy="390" rx="26" ry="38" />
            <ellipse cx="1180" cy="400" rx="18" ry="30" />
          </g>

          <!-- Castle silhouette -->
          <g class="castle" fill="#2a3348" transform="translate(860,290)">
            <rect x="0" y="24" width="90" height="70" />
            <rect x="-18" y="8" width="24" height="86" />
            <rect x="82" y="0" width="22" height="94" />
            <polygon points="-18,8  -5,-12  6,8" />
            <polygon points="82,0  93,-20  104,0" />
            <rect x="26" y="10" width="14" height="26" />
            <rect x="50" y="14" width="14" height="22" />
            <rect x="36" y="52" width="18" height="24" fill="#1a2233" />
            <rect x="-10" y="34" width="8" height="10" fill="#f0c27a" opacity="0.75" />
            <rect x="90" y="28" width="8" height="10" fill="#f0c27a" opacity="0.75" />
          </g>

          <!-- Soaring dragon -->
          <g class="dragon" transform="translate(280,95) scale(1.55)">
            <g class="dragon-soar">
              <path
                class="wing wing-back"
                d="M70 48 C35 15, 5 5, -18 30 C18 32, 42 46, 64 60 Z"
                fill="url(#wingGrad)"
              />
              <path
                d="M55 55 C80 40, 130 35, 175 48 C195 55, 205 70, 190 78 C160 70, 120 68, 90 78 C70 84, 50 75, 55 55 Z"
                fill="url(#dragonBody)"
              />
              <path
                d="M175 48 C190 32, 214 36, 224 52 C214 54, 196 56, 184 60 Z"
                fill="#245c38"
              />
              <circle cx="208" cy="47" r="2.6" fill="#f6e27a" />
              <path
                d="M190 78 C168 98, 148 114, 142 132"
                fill="none"
                stroke="#1a4d2e"
                stroke-width="7"
                stroke-linecap="round"
              />
              <path d="M142 132 L134 140 L148 137 L142 146" fill="#c4543a" />
              <path
                class="wing wing-front"
                d="M85 52 C98 5, 148 -12, 185 20 C148 28, 118 46, 96 64 Z"
                fill="url(#wingGrad)"
              />
              <path
                d="M95 70 L86 94 M112 72 L108 96 M128 70 L134 92"
                stroke="#163d26"
                stroke-width="3.5"
                stroke-linecap="round"
              />
            </g>
          </g>

          <!-- Foreground hill -->
          <path
            class="hill"
            d="M0 430 C220 370, 420 400, 640 385 C860 370, 1080 400, 1280 360 L1280 720 L0 720 Z"
            fill="url(#nearHill)"
          />
          <rect width="1280" height="720" fill="url(#dither)" opacity="0.28" />

          <!-- Path -->
          <path
            d="M500 720 C560 580, 600 500, 640 440 C680 500, 720 580, 780 720"
            fill="#7a5c34"
            opacity="0.62"
          />

          <!-- Heroes party — centered in lower third -->
          <g class="heroes" transform="translate(390, 395) scale(1.45)">
            <!-- Knight -->
            <g class="hero hero-knight" transform="translate(0,0)">
              <ellipse cx="28" cy="118" rx="24" ry="8" fill="#142010" opacity="0.5" />
              <rect x="18" y="48" width="22" height="38" rx="3" fill="#6d7888" />
              <rect x="13" y="43" width="32" height="14" rx="2" fill="#8a95a5" />
              <circle cx="29" cy="33" r="13" fill="#e0b089" />
              <path d="M15 26 H43 V36 C43 20, 15 20, 15 36 Z" fill="#c9a227" />
              <rect x="20" y="86" width="9" height="26" fill="#3a4656" />
              <rect x="32" y="86" width="9" height="26" fill="#3a4656" />
              <rect x="15" y="110" width="16" height="7" fill="#2a2118" />
              <rect x="31" y="110" width="16" height="7" fill="#2a2118" />
              <g class="sword" transform="translate(52,36)">
                <rect x="0" y="0" width="5" height="48" fill="#d8dde6" />
                <rect x="-7" y="38" width="19" height="5" fill="#c9a227" />
                <polygon points="2.5,-10  -3,0  8,0" fill="#eef2f7" />
              </g>
              <path d="M4 54 L18 48 L18 80 L4 73 Z" fill="#b87333" />
              <circle cx="11" cy="64" r="5" fill="#2f7a4a" />
            </g>

            <!-- Mage -->
            <g class="hero hero-mage" transform="translate(95,12)">
              <ellipse cx="24" cy="110" rx="22" ry="7" fill="#142010" opacity="0.5" />
              <path d="M6 40 L42 40 L38 92 L10 92 Z" fill="#2f4f8a" />
              <path d="M4 37 L44 37 L39 50 L9 50 Z" fill="#3d63a8" />
              <circle cx="24" cy="28" r="12" fill="#e0b089" />
              <path d="M8 24 C13 6, 35 6, 40 24 L35 27 C31 16, 17 16, 13 27 Z" fill="#1e2a44" />
              <polygon points="24,4 19,18 29,18" fill="#c9a227" />
              <rect x="14" y="92" width="8" height="20" fill="#2a2118" />
              <rect x="27" y="92" width="8" height="20" fill="#2a2118" />
              <g class="staff" transform="translate(48,12)">
                <rect x="0" y="12" width="5" height="86" fill="#6b4226" />
                <circle cx="2.5" cy="6" r="9" fill="#5ec8e6" />
                <circle cx="2.5" cy="6" r="4.5" fill="#dff7ff" />
              </g>
            </g>

            <!-- Archer -->
            <g class="hero hero-archer" transform="translate(195,6)">
              <ellipse cx="22" cy="114" rx="20" ry="7" fill="#142010" opacity="0.5" />
              <rect x="11" y="46" width="22" height="36" rx="3" fill="#6b4a2a" />
              <circle cx="22" cy="32" r="12" fill="#e0b089" />
              <path d="M8 26 H36 V35 C29 22, 15 22, 8 35 Z" fill="#3f6b32" />
              <rect x="13" y="82" width="8" height="26" fill="#3a2a18" />
              <rect x="25" y="82" width="8" height="26" fill="#3a2a18" />
              <rect x="10" y="106" width="13" height="6" fill="#2a2118" />
              <rect x="24" y="106" width="13" height="6" fill="#2a2118" />
              <path
                d="M2 38 C-12 60, -10 92, 6 108"
                fill="none"
                stroke="#8b5a2b"
                stroke-width="3.5"
              />
              <line x1="2" y1="38" x2="6" y2="108" stroke="#d8c39a" stroke-width="1.8" />
              <rect x="36" y="54" width="18" height="3.5" fill="#c9a227" />
            </g>

            <!-- Cleric -->
            <g class="hero hero-cleric" transform="translate(285,16)">
              <ellipse cx="22" cy="108" rx="20" ry="7" fill="#142010" opacity="0.5" />
              <path d="M6 42 L38 42 L36 90 L8 90 Z" fill="#d9d2c5" />
              <path d="M4 39 L40 39 L35 54 L9 54 Z" fill="#f0ebe1" />
              <circle cx="22" cy="28" r="11" fill="#e0b089" />
              <path d="M10 20 H34 V30 H10 Z" fill="#c9a227" />
              <rect x="20" y="12" width="5" height="16" fill="#c9a227" />
              <rect x="13" y="90" width="7" height="18" fill="#2a2118" />
              <rect x="25" y="90" width="7" height="18" fill="#2a2118" />
              <g transform="translate(42,46)">
                <rect x="0" y="0" width="4" height="44" fill="#c9a227" />
                <rect x="-7" y="8" width="18" height="4" fill="#c9a227" />
              </g>
            </g>
          </g>
        </svg>
      </div>

      <div class="scanlines" aria-hidden="true"></div>

      <header class="brand">
        <h1 class="logo" aria-label="Dragon Quest">
          <span class="logo-line">Dragon</span>
          <span class="logo-line">Quest</span>
        </h1>
        <p class="tagline">An SVGA-era adventure awaits</p>
      </header>

      <div class="cta-wrap">
        <button type="button" class="begin-btn" id="beginQuest">
          <span class="begin-btn__label">Begin Quest</span>
        </button>
      </div>

      <p class="hint" id="statusHint">Press Begin Quest to start your adventure</p>
    </main>

    <script src="main.js"></script>
  </body>
</html>
